services:
  postgres:
    image: postgres:16-alpine
    container_name: pern-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-pern_monorepo_dev}
    ports:
      - "${PGPORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    container_name: pern-server
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres}@postgres:5432/${PGDATABASE:-pern_monorepo_dev}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key}
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps/server/src:/app/src

  client:
    build:
      context: ../../apps/client
      dockerfile: Dockerfile
    container_name: pern-client
    restart: always
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  postgres_data:
