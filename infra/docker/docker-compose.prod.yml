services:
  postgres:
    image: postgres:16-alpine
    container_name: pern-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    container_name: pern-prod-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  client:
    build:
      context: ../../apps/client
      dockerfile: Dockerfile
    container_name: pern-prod-client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  prod_postgres_data:
