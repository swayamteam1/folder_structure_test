version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pern-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: pern-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: pern-prod-web
    restart: always
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: pern-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api

volumes:
  prod_postgres_data:
